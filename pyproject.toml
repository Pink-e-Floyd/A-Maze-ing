[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator: perfect mazes, loops, 42 pattern and BFS solver"
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "hesantan" },
    { name = "tjulya-c" }
]
dependencies = []

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["py.typed"]

[tool.mypy]
exclude = ["^\\.venv/", "^venv/", "^build/", "^dist/"]
